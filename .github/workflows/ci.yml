name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Tests
        run: npm test

      - name: Smoke test (no API key needed)
        run: |
          PORT=5599 node server.js &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:5599/health && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:5599/api/roadmap | head -c 120
          echo
          curl -sf http://127.0.0.1:5599/api/stats | head -c 200
          echo
          curl -sf http://127.0.0.1:5599/ | head -c 80
          echo
          curl -sf http://127.0.0.1:5599/styles.css -o /dev/null
          curl -sf http://127.0.0.1:5599/app.js -o /dev/null
